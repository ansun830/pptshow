<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .stamp-outer {
        fill: none;
        stroke: #E60026;
        stroke-width: 8;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .stamp-stroke {
        fill: none;
        stroke: #E60026;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>
  <!-- 外框圆角矩形 -->
  <rect class="stamp-outer" x="6" y="6" width="88" height="88" rx="14" ry="14" />
  <!-- 内部“基”字建筑结构线 -->
  <line class="stamp-stroke" x1="24" y1="24" x2="76" y2="24" />
  <line class="stamp-stroke" x1="35" y1="24" x2="35" y2="49" />
  <line class="stamp-stroke" x1="65" y1="24" x2="65" y2="49" />
  <line class="stamp-stroke" x1="35" y1="37" x2="65" y2="37" />
  <line class="stamp-stroke" x1="25" y1="49" x2="75" y2="49" />
  <path class="stamp-stroke" d="M 35 49 C 33 59, 28 67, 23 69" />
  <path class="stamp-stroke" d="M 65 49 C 67 59, 72 67, 77 69" />
  <line class="stamp-stroke" x1="50" y1="49" x2="50" y2="76" />
  <line class="stamp-stroke" x1="34" y1="76" x2="66" y2="76" />
</svg>
